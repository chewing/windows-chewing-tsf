name: CI

on:
  push:
    branches: ["main", "stable/*"]
  pull_request:
    branches: ["main", "stable/*"]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      nightly:
        description: "Update all submodules to build nightly build"
        default: true
        required: true
        type: boolean
    outputs:
      unsigned-artifact-id:
        description: "Unsigned Installer"
        value: ${{ jobs.package.outputs.unsigned-artifact-id }}

env:
  CACHE_SERVER: ssh://nix-cache@tyo2.qwty.org?priority=100&compress=1&max-connections=8&want-mass-query=1
  CACHE_PUB_KEY: qwty-nix-cache-1:Vwy+6/XVxQxkqEq4xfWrz9vCI+95slOCjYNS63+4MK0=

jobs:
  build:
    runs-on: fedora-latest
    name: Build
    steps:
      - name: Install build dependencies
        run: |
          sudo dnf -y install nix git

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate version info
        run: |
          nix/version.sh
          cat tip/rc/version.rc
          cat installer/version.json
          cat installer/version.wxi

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.BINARY_CACHE_SSH_KEY }}
          SSH_HOST_KEY: ${{ vars.BINARY_CACHE_SSH_HOST_KEY }}
        run: |
          mkdir $HOME/.ssh
          echo "$SSH_KEY" > $HOME/.ssh/id_ed25519
          echo "$SSH_HOST_KEY" >> $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/id_ed25519

      - name: Build nightly
        if: ${{ inputs.nightly || github.event_name == 'pull_request' }}
        run: |
          nix-build --arg nightly true --extra-substituters $CACHE_SERVER --extra-trusted-public-keys $CACHE_PUB_KEY 

      - name: Build release
        if: ${{ !inputs.nightly && github.event_name != 'pull_request' }}
        run: |
          nix-build --extra-substituters $CACHE_SERVER --extra-trusted-public-keys $CACHE_PUB_KEY 

      # - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
      #   if: false
      #   with:
      #     name: Installer Artifact With Debuginfo
      #     path: result

      # - name: Strip debug info
      #   if: false
      #   run: |
      #     x86_64-w64-mingw32-strip build/installer/x64/chewing_tip.dll
      #     i686-w64-mingw32-strip build/installer/x86/chewing_tip.dll
      #     x86_64-w64-mingw32-strip build/installer/*.exe

      - env:
          BINARY_CACHE_KEY: ${{ secrets.BINARY_CACHE_KEY }}
        run: |
          echo "$BINARY_CACHE_KEY" > binary_cache.key

      - name: Cache result
        env:
          CACHE_SERVER: ssh-ng://nix-cache@tyo2.qwty.org
        run: |
          nix store sign --all --key-file binary_cache.key
          rm binary_cache.key
          nix copy -s --to $CACHE_SERVER ./result
          nix copy -s --all --to $CACHE_SERVER

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: false
        with:
          name: Installer Artifact
          path: result
