name: CI

on:
  push:
    branches: ["main", "stable/*"]
  pull_request:
    branches: ["main", "stable/*"]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      nightly:
        description: "Update all submodules to build nightly build"
        default: true
        required: true
        type: boolean
    outputs:
      unsigned-artifact-id:
        description: "Unsigned Installer"
        value: ${{ jobs.build.outputs.unsigned-artifact-id }}
      version:
        description: "Version"
        value: ${{ jobs.build.outputs.version }}

env:
  CACHE_SERVER: https://cache.nix.qwty.org
  CACHE_PUB_KEY: qwty-nix-cache-1:Vwy+6/XVxQxkqEq4xfWrz9vCI+95slOCjYNS63+4MK0=

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    name: Build
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version: ${{ steps.version-info.outputs.version }}
    steps:
      - name: Install build dependencies
        run: |
          sudo dnf -y install nix git jq

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version-info
        run: |
          git config --global --add safe.directory /__w/windows-chewing-tsf/windows-chewing-tsf
          nix/version.sh
          cat tip/rc/version.rc
          cat installer/version.json
          cat installer/version.wxi
          version=`jq -r .product_version installer/version.json`
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build nightly
        if: ${{ inputs.nightly || github.event_name == 'pull_request' }}
        run: |
          nix-build -A msi --arg nightly true --extra-substituters $CACHE_SERVER --extra-trusted-public-keys $CACHE_PUB_KEY 

      - name: Build release
        if: ${{ !inputs.nightly && github.event_name != 'pull_request' }}
        run: |
          nix-build -A msi --extra-substituters $CACHE_SERVER --extra-trusted-public-keys $CACHE_PUB_KEY 

      - id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: result/*.msi
