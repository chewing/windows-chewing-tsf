name: CI

on:
  push:
    branches: ["main", "stable/*"]
  pull_request:
    branches: ["main", "stable/*"]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      nightly:
        description: "Update all submodules to build nightly build"
        default: true
        required: true
        type: boolean
    outputs:
      unsigned-artifact-id:
        description: "Unsigned Installer"
        value: ${{ jobs.build.outputs.unsigned-artifact-id }}
      version:
        description: "Version"
        value: ${{ jobs.build.outputs.version }}

env:
  CACHE_SERVER: ssh://nix-cache@tyo2.qwty.org?priority=100&compress=1&max-connections=8&want-mass-query=1
  CACHE_PUB_KEY: qwty-nix-cache-1:Vwy+6/XVxQxkqEq4xfWrz9vCI+95slOCjYNS63+4MK0=

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    name: Build
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version: ${{ steps.version-info.outputs.version }}
    steps:
      - name: Install build dependencies
        run: |
          sudo dnf -y install nix git jq

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version-info
        run: |
          git config --global --add safe.directory /__w/windows-chewing-tsf/windows-chewing-tsf
          nix/version.sh
          cat tip/rc/version.rc
          cat installer/version.json
          cat installer/version.wxi
          version=`jq -r .product_version installer/version.json`
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          HOME: /root
          SSH_PRIV_KEY: ${{ secrets.BINARY_CACHE_SSH_KEY }}
          SSH_HOST_KEY: ${{ vars.BINARY_CACHE_SSH_HOST_KEY }}
        run: |
          mkdir $HOME/.ssh
          echo "$SSH_PRIV_KEY" > $HOME/.ssh/id_ed25519
          echo "$SSH_HOST_KEY" >> $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/id_ed25519

      - name: Build nightly
        if: ${{ inputs.nightly || github.event_name == 'pull_request' }}
        run: |
          nix-build --arg nightly true --extra-substituters $CACHE_SERVER --extra-trusted-public-keys $CACHE_PUB_KEY 

      - name: Build release
        if: ${{ !inputs.nightly && github.event_name != 'pull_request' }}
        run: |
          nix-build --extra-substituters $CACHE_SERVER --extra-trusted-public-keys $CACHE_PUB_KEY 

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: Installer Artifact With Debuginfo
      #     path: build/installer

      # - name: Strip debug info
      #   run: |
      #     x86_64-w64-mingw32-strip build/installer/x64/chewing_tip_x64.dll
      #     aarch64-w64-mingw32-strip build/installer/x64/chewing_tip_arm64.dll
      #     i686-w64-mingw32-strip build/installer/x86/chewing_tip.dll
      #     x86_64-w64-mingw32-strip build/installer/*.exe

      - id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: Unsigned Installer
          path: |
            result/windows-chewing-tsf-*.msi
