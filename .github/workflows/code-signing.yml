name: Code Signing

on:
  workflow_call:
    inputs:
      signing-policy-slug:
        required: true
        type: string
      github-artifact-id:
        required: true
        type: string
    secrets:
      api-token:
        required: true

jobs:
  code-signing:
    runs-on: ubuntu-latest
    name: Code Signing
    steps:
      - uses: actions/download-artifact@v8
      - name: Sign Artifact
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: "${{ secrets.api-token }}"
          organization-id: "e8feb3e7-02b0-4e78-aa0a-f3431f374964"
          project-slug: "windows-chewing-tsf"
          signing-policy-slug: "${{ inputs.signing-policy-slug }}"
          artifact-configuration-slug: "Universal_Installer"
          github-artifact-id: "${{ inputs.github-artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: dist
      - name: Calculate Checksum
        run: |
          filename=(basename dist/*.msi)
          mv dist/windows-chewing-tsf*.msi dist/
          sha256sum dist/$filename > dist/$filename.sha256
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Signed Installer
          path: |
            dist/windows-chewing-tsf*.msi
            dist/windows-chewing-tsf*.msi.sha256
