name: Nightly Build

on:
  workflow_dispatch:

jobs:
  nightly-build:
    name: Build
    uses: ./.github/workflows/ci.yml
    with:
      nightly: true
      package: false

  sign-binaries:
    name: Sign Binaries
    needs: [nightly-build]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/code-signing.yml
    with:
      signing-policy-slug: release-signing
      artifact-configuration-slug: binaries_zip
      artifact-name: Signed Binaries
      github-artifact-id: ${{ needs.nightly-build.outputs.binaries-artifact-id }}
    secrets:
      api-token: ${{ secrets.SIGNPATH_API_TOKEN }}

  package:
    name: Package
    needs: [nightly-build, sign-binaries]
    uses: ./.github/workflows/msi-build.yml
    with:
      input-artifact-name: Signed Binaries
      output-artifact-name: Unsigned Installer
      msi-name: ${{ needs.nightly-build.outputs.msi-name }}

  sign-msi:
    name: Sign MSI
    needs: [package]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/code-signing.yml
    with:
      signing-policy-slug: release-signing
      artifact-configuration-slug: msi_only
      artifact-name: Signed Installer
      skip-decompress: true
      compute-checksum: true
      github-artifact-id: ${{ needs.package.outputs.artifact-id }}
    secrets:
      api-token: ${{ secrets.SIGNPATH_API_TOKEN }}

  nightly-release:
    runs-on: ubuntu-latest
    name: Nightly Release
    needs: [nightly-build, sign-msi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Signed Installer
          path: dist
      - name: GH Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: nightly-${{ needs.nightly-build.outputs.version }}
          name: 預覽版 ${{ needs.nightly-build.outputs.version }}
          draft: true
          prerelease: true
          preserve_order: true
          body: |
            這是開發中的測試用版本。若不確定，請使用最新的穩定版。
          files: |
            dist/windows-chewing-tsf*.msi
            dist/windows-chewing-tsf*.msi.sha256
