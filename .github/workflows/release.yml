name: Release Build

on:
  push:
    tags:
      - "v2*"

jobs:
  release-build:
    name: Build
    uses: ./.github/workflows/ci.yml
    with:
      nightly: false
      package: false

  sign-binaries:
    name: Sign Binaries
    needs: [release-build]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/code-signing.yml
    with:
      signing-policy-slug: release-signing
      artifact-configuration-slug: binaries_zip
      artifact-name: Signed Binaries
      github-artifact-id: ${{ needs.release-build.outputs.binaries-artifact-id }}
    secrets:
      api-token: ${{ secrets.SIGNPATH_API_TOKEN }}

  package:
    name: Package
    needs: [release-build, sign-binaries]
    uses: ./.github/workflows/msi-build.yml
    with:
      input-artifact-name: Signed Binaries
      output-artifact-name: Unsigned Installer
      msi-name: ${{ needs.release-build.outputs.msi-name }}

  sign-msi:
    name: Sign MSI
    needs: [package]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/code-signing.yml
    with:
      signing-policy-slug: release-signing
      artifact-configuration-slug: msi_only
      artifact-name: Signed Installer
      skip-decompress: true
      compute-checksum: true
      github-artifact-id: ${{ needs.package.outputs.artifact-id }}
    secrets:
      api-token: ${{ secrets.SIGNPATH_API_TOKEN }}

  release:
    runs-on: ubuntu-latest
    name: Release
    needs: [release-build, sign-msi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Signed Installer
          path: dist
      - name: GH Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: 穩定版 ${{ github.ref_name }}
          draft: true
          preserve_order: true
          body: |
            更新摘要
          files: |
            dist/windows-chewing-tsf*.msi
            dist/windows-chewing-tsf*.msi.sha256
