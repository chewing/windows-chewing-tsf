[workspace]
resolver = "3"
members = [
  "crates/chewing_tip_core",
  "crates/chewing_tip_host",
  "crates/tsfreg",
  "tip",
  "xtask"
]

[workspace.package]
version = "26.7.2"

[workspace.dependencies]
anyhow = "1"
chewing = "0.13.0"
embed-resource = "3.0.1"
interprocess = "2.4.1"
log = "0.4.29"
scoped-error = "0.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
debug = true
lto = "thin"
panic = "abort"

